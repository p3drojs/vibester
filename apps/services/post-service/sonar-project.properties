# Gerado para o piloto de analise estatica do Vibester.
# Uso: node ../sonar/scan.mjs post-service   (ver apps/services/sonar/README.md)

sonar.projectKey=vibester-post-service
sonar.projectName=Vibester / post-service
sonar.sourceEncoding=UTF-8

# --- Fontes --------------------------------------------------------------
sonar.sources=src
# Parte dos testes mora dentro de src/ (*.test.ts, __tests__/). Eles sao
# indexados como teste, nunca como fonte -- ver sonar.exclusions abaixo.
sonar.tests=tests,src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**

# --- O que nao e codigo de producao --------------------------------------
# src/generated/** e o client do Prisma: milhares de linhas geradas que
# dominariam completamente as metricas de duplicacao e complexidade.
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,src/generated/**,prisma/generated/**,**/*.d.ts,**/*.test.ts,**/*.spec.ts,**/__tests__/**

# --- Cobertura -----------------------------------------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/config/**,src/errors/**,src/kafka/**,src/repository/**,src/schema/**,src/types/**,src/utils/**,src/generate-spec.ts,src/server.ts
